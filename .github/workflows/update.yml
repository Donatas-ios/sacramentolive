name: Update Sacramento Live

on:
  schedule:
    - cron: '0 15 * * *'   # 7am PST (UTC-8) / 8am PDT (UTC-7)
  workflow_dispatch:        # allow manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browsers
        run: python -m playwright install chromium --with-deps

      - name: Run scraper and generator
        run: python run.py
        env:
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
          EVENTBRITE_API_KEY: ${{ secrets.EVENTBRITE_API_KEY }}
          MEETUP_API_KEY: ${{ secrets.MEETUP_API_KEY }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}

      - name: Commit and push updated site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html docs/trivia.html docs/museums.html docs/restaurants.html
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update events $(date -u '+%Y-%m-%d')"
            git push
          fi
